# Offline CI: lint, tests, real test count, doc drift, brand check, IaC validation, Helm lint and a full-history secret scan.
# No model files or API keys are used. Actions are pinned to commit SHAs (Dependabot bumps them).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - name: Install (package with dev extras)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Test count (printed, not swallowed)
        run: python scripts/count_tests.py
      - name: Offline demo
        run: p360 demo
      - name: Results, README block and catalog match a fresh run
        run: python scripts/render_docs.py --check
      - name: Brand check (hashed blocklist)
        run: python scripts/check_brands.py

  iac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.9.8" }
      - name: terraform fmt + validate (azure, aws, gcp) - never applied
        run: |
          for c in azure aws gcp; do
            (cd deploy/terraform/$c && terraform fmt -check && terraform init -backend=false -input=false && terraform validate)
          done
      - name: bicep build (parity with terraform/azure)
        run: az bicep install && az bicep build --file deploy/bicep/main.bicep --stdout > /dev/null
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: "v3.16.2" }
      - name: helm lint + render every profile
        run: |
          helm lint deploy/helm/p360
          for p in deploy/profiles/*.yaml; do helm template t deploy/helm/p360 -f "$p" > /dev/null; done

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
